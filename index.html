<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml' lang='' xml:lang=''>
<head>
	<meta charset='utf-8' />
	<meta name='viewport' content='width=device-width, user-scalable=no' />
	<link id='-gd-engine-icon' rel='icon' type='image/png' href='favicon.png' />
	<title>illjin</title>
	<style type='text/css'>

		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}

		canvas {
		    /* 꾹 눌렀을 때 돋보기나 컨텍스트 메뉴가 뜨는 것을 방지 */
		    -webkit-touch-callout: none;
		    -webkit-user-select: none;
		    user-select: none;
		}


		#canvas {
			display: block;
			margin: 0;
			color: white;
		}

		#canvas:focus {
			outline: none;
		}

		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0;
			background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e;
			box-shadow: 0 0 1px 1px #2f2d35;
		}


		/* Status display
		 * ============== */

		#status {
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			/* don't consume click events - make children visible explicitly */
			visibility: hidden;
		}

		#status-progress {
			width: 366px;
			height: 7px;
			background-color: #38363A;
			border: 1px solid #444246;
			padding: 1px;
			box-shadow: 0 0 2px 1px #1B1C22;
			border-radius: 2px;
			visibility: visible;
		}

		@media only screen and (orientation:portrait) {
			#status-progress {
				width: 61.8%;
			}
		}

		#status-progress-inner {
			height: 100%;
			width: 0;
			box-sizing: border-box;
			transition: width 0.5s linear;
			background-color: #202020;
			border: 1px solid #222223;
			box-shadow: 0 0 1px 1px #27282E;
			border-radius: 3px;
		}

		#status-indeterminate {
			visibility: visible;
			position: relative;
		}

		#status-indeterminate > div {
			width: 4.5px;
			height: 0;
			border-style: solid;
			border-width: 9px 3px 0 3px;
			border-color: #2b2b2b transparent transparent transparent;
			transform-origin: center 21px;
			position: absolute;
		}

		#status-indeterminate > div:nth-child(1) { transform: rotate( 22.5deg); }
		#status-indeterminate > div:nth-child(2) { transform: rotate( 67.5deg); }
		#status-indeterminate > div:nth-child(3) { transform: rotate(112.5deg); }
		#status-indeterminate > div:nth-child(4) { transform: rotate(157.5deg); }
		#status-indeterminate > div:nth-child(5) { transform: rotate(202.5deg); }
		#status-indeterminate > div:nth-child(6) { transform: rotate(247.5deg); }
		#status-indeterminate > div:nth-child(7) { transform: rotate(292.5deg); }
		#status-indeterminate > div:nth-child(8) { transform: rotate(337.5deg); }

		#status-notice {
			margin: 0 100px;
			line-height: 1.3;
			visibility: visible;
			padding: 4px 6px;
			visibility: visible;
		}
	</style>

	<script>
	(function() {
	    // ⭐️ iOS/iPadOS WebGL 컨텍스트 null 에러 완벽 방어 코드
	    const originalGetContext = HTMLCanvasElement.prototype.getContext;
	    
	    HTMLCanvasElement.prototype.getContext = function(type, attributes) {
	        const gl = originalGetContext.apply(this, arguments);
	        
	        if (gl && (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl')) {
	            // original getContextAttributes를 백업
	            const originalGetAttributes = gl.getContextAttributes;
	            
	            gl.getContextAttributes = function() {
	                const attrs = originalGetAttributes ? originalGetAttributes.apply(this, arguments) : null;
	                
	                // 만약 브라우저가 null을 뱉으면, Godot이 튕기지 않도록 기본 객체를 강제로 반환합니다.
	                if (!attrs) {
	                    console.warn("Godot iPadOS Fix: gl.getContextAttributes() returned null. Mocking object to prevent crash.");
	                    return {
	                        alpha: true,
	                        antialias: true, // 에러가 나던 핵심 속성을 강제로 true 설정
	                        depth: true,
	                        failIfMajorPerformanceCaveat: false,
	                        powerPreference: "default",
	                        premultipliedAlpha: true,
	                        preserveDrawingBuffer: false,
	                        stencil: false,
	                        desynchronized: false
	                    };
	                }
	                return attrs;
	            };
	        }
	        return gl;
	    };
	})();
</script>


</head>
<body>
	<canvas id='canvas'>
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<!-- iPadOS 블루투스 키보드 인식을 위한 숨겨진 인풋창 -->
	<input type="text" id="ios-keyboard-fix" style="
    	position: fixed;
    	top: -100px;
    	left: -100px;
    	width: 1px;
    	height: 1px;
    	opacity: 0;
    	pointer-events: none;
    	z-index: -9999;"
	tabindex="-1">

	<div id='status'>
		<div id='status-progress' style='display: none;' oncontextmenu='event.preventDefault();'><div id ='status-progress-inner'></div></div>
		<div id='status-indeterminate' style='display: none;' oncontextmenu='event.preventDefault();'>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
			<div></div>
		</div>
		<div id='status-notice' class='godot' style='display: none;'></div>
	</div>

	<script type='text/javascript' src='index.js'></script>
	<script type='text/javascript'>//<![CDATA[

		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":36738896,"index.wasm":12660493},"gdnativeLibs":[]};
		var engine = new Engine(GODOT_CONFIG);

		(function() {
			const INDETERMINATE_STATUS_STEP_MS = 100;
			var statusProgress = document.getElementById('status-progress');
			var statusProgressInner = document.getElementById('status-progress-inner');
			var statusIndeterminate = document.getElementById('status-indeterminate');
			var statusNotice = document.getElementById('status-notice');

			var initializing = true;
			var statusMode = 'hidden';

			var animationCallbacks = [];
			function animate(time) {
				animationCallbacks.forEach(callback => callback(time));
				requestAnimationFrame(animate);
			}
			requestAnimationFrame(animate);

			function setStatusMode(mode) {

				if (statusMode === mode || !initializing)
					return;
				[statusProgress, statusIndeterminate, statusNotice].forEach(elem => {
					elem.style.display = 'none';
				});
				animationCallbacks = animationCallbacks.filter(function(value) {
					return (value != animateStatusIndeterminate);
				});
				switch (mode) {
					case 'progress':
						statusProgress.style.display = 'block';
						break;
					case 'indeterminate':
						statusIndeterminate.style.display = 'block';
						animationCallbacks.push(animateStatusIndeterminate);
						break;
					case 'notice':
						statusNotice.style.display = 'block';
						break;
					case 'hidden':
						break;
					default:
						throw new Error('Invalid status mode');
				}
				statusMode = mode;
			}

			function animateStatusIndeterminate(ms) {
				var i = Math.floor(ms / INDETERMINATE_STATUS_STEP_MS % 8);
				if (statusIndeterminate.children[i].style.borderTopColor == '') {
					Array.prototype.slice.call(statusIndeterminate.children).forEach(child => {
						child.style.borderTopColor = '';
					});
					statusIndeterminate.children[i].style.borderTopColor = '#dfdfdf';
				}
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				var lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			};

			function displayFailureNotice(err) {
				var msg = err.message || err;
				console.error(msg);
				setStatusNotice(msg);
				setStatusMode('notice');
				initializing = false;
			};

			if (!Engine.isWebGLAvailable()) {
				displayFailureNotice('WebGL not available');
			} else {
				setStatusMode('indeterminate');
				engine.startGame({
					'onProgress': function (current, total) {
						if (total > 0) {
							statusProgressInner.style.width = current/total * 100 + '%';
							setStatusMode('progress');
							if (current === total) {
								// wait for progress bar animation
								setTimeout(() => {
									setStatusMode('indeterminate');
								}, 500);
							}
						} else {
							setStatusMode('indeterminate');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
					initializing = false;
				}, displayFailureNotice);
			}
		})();
	//]]></script>
	<script>
		document.addEventListener("DOMContentLoaded", () => {
		    const canvas = document.getElementById("canvas"); // 고도 캔버스 ID 확인
		    if (!canvas) return;
		
		    let touchStartTimer = null;
		    let isLongPress = false;
		    let isDragging = false;
		    let startX = 0;
		    let startY = 0;
		
		    // [핵심 함수] 마우스 이벤트를 복사해서 던지는 함수
		    function relayMouseEvent(type, touch, buttonCode) {
		        const rect = canvas.getBoundingClientRect();
		        
		        // 고도 엔진이 필요로 하는 내부 상대 좌표 정확히 계산
		        const clientX = touch.clientX;
		        const clientY = touch.clientY;
		        const screenX = touch.screenX;
		        const screenY = touch.screenY;
		
		        const mouseEvent = new MouseEvent(type, {
		            bubbles: true,
		            cancelable: true,
		            view: window,
		            detail: type === "mousemove" ? 0 : 1,
		            screenX: screenX,
		            screenY: screenY,
		            clientX: clientX,
		            clientY: clientY,
		            ctrlKey: false,
		            altKey: false,
		            shiftKey: false,
		            metaKey: false,
		            button: buttonCode, // 0: 좌클릭, 2: 우클릭
		            buttons: type === "mousemove" ? (buttonCode === 2 ? 2 : 1) : (type === "mouseup" ? 0 : (buttonCode === 2 ? 2 : 1)),
		            relatedTarget: null
		        });
		        
		        // ⭐️ 핵심: 고도 엔진 특성상 mousedown은 canvas에, 
		        // mousemove(드래그)와 mouseup은 window 객체에 모두 던져주어야 인식합니다.
		        canvas.dispatchEvent(mouseEvent);
		        window.dispatchEvent(mouseEvent);
		    }
		
		    // 1. 터치 시작
		    canvas.addEventListener("touchstart", (e) => {
		        if (e.touches.length === 1) {
		            const touch = e.touches[0];
		            startX = touch.clientX;
		            startY = touch.clientY;
		            isLongPress = false;
		            isDragging = false;
		
		            // 터치한 즉시 일단 마우스 왼쪽 클릭 다운 전송 (드래그 시작점 인지용)
		            relayMouseEvent("mousedown", touch, 0);
		
		            // 0.4초 동안 안 움직이고 가만히 누르고 있으면 우클릭 전환
		            touchStartTimer = setTimeout(() => {
		                if (!isDragging) {
		                    isLongPress = true;
		                    relayMouseEvent("mouseup", touch, 0);    // 왼쪽 클릭 떼기
		                    relayMouseEvent("mousedown", touch, 2);  // 오른쪽 클릭 누르기
		                    relayMouseEvent("mouseup", touch, 2);    // 오른쪽 클릭 떼기
		                    if (navigator.vibrate) navigator.vibrate(40); // 햅틱 피드백
		                }
		            }, 400); 
		        }
		    }, { passive: false });
		
		    // 2. 터치 이동 (마우스 드래그 변환)
		    canvas.addEventListener("touchmove", (e) => {
		        if (e.touches.length === 1) {
		            const touch = e.touches[0];
		            
		            // 미세한 흔들림은 드래그로 판정하지 않음 (유격 차단)
		            const moveX = Math.abs(touch.clientX - startX);
		            const moveY = Math.abs(touch.clientY - startY);
		            
		            if (moveX > 3 || moveY > 3) {
		                isDragging = true;
		                clearTimeout(touchStartTimer); // 움직이기 시작하면 우클릭 타이머 해제
		            }
		
		            // 우클릭 진행 중이 아닐 때만 마우스 드래그(mousemove) 전송
		            if (!isLongPress) {
		                relayMouseEvent("mousemove", touch, 0);
		            }
		            
		            // ⭐️ 중요: 아이패드 자체 웹페이지 바운스 및 스크롤을 막아 드래그 본연의 동작 확보
		            e.preventDefault(); 
		        }
		    }, { passive: false });
		
		    // 3. 터치 종료
		    canvas.addEventListener("touchend", (e) => {
		        clearTimeout(touchStartTimer);
		        
		        if (e.changedTouches.length === 1) {
		            const touch = e.changedTouches[0];
		            if (!isLongPress) {
		                relayMouseEvent("mouseup", touch, 0); // 마우스 왼쪽 떼기
		            }
		        }
		        isDragging = false;
		        isLongPress = false;
		    }, { passive: false });
		});

	</script>
</body>
</html>
